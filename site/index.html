<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Homework web app" />
    <title>Homework</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Homework workspace</p>
      <h1>Your submission is ready for the web.</h1>
      <p class="lede">
        Replace this starter page with your assignment. Every push to
        <code>main</code> publishes the latest version automatically.
      </p>
      <section class="card" aria-labelledby="status-title">
        <div>
          <p class="label" id="status-title">Deployment status</p>
          <p class="status"><span aria-hidden="true"></span> GitHub Pages enabled</p>
        </div>
        <p id="updated" class="updated"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
